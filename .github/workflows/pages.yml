name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site/examples site/dist
          cp -r examples/. site/examples/
          cp -r dist/. site/dist/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./examples/">
          <title>Sonarium</title>
          <meta property="og:title" content="Sonarium｜讓網頁自己發出空間聲音">
          <meta property="og:description" content="一行 script 標籤，把任何網頁變成可旋轉的全球面聲場。左邊的按鈕從左邊發聲，滑鼠轉動的是整個聲場。">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://frank890417.github.io/sonarium/">
          <meta property="og:site_name" content="Che-Yu Wu 吳哲宇">
          <meta property="og:locale" content="zh_TW">
          <meta property="og:image" content="https://frank890417.github.io/sonarium/examples/og.jpg">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="Sonarium｜讓網頁自己發出空間聲音">
          <meta name="twitter:description" content="一行 script 標籤，把任何網頁變成可旋轉的全球面聲場。左邊的按鈕從左邊發聲，滑鼠轉動的是整個聲場。">
          <meta name="twitter:image" content="https://frank890417.github.io/sonarium/examples/og.jpg">
          <a href="./examples/">Enter the soundfield →</a>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
